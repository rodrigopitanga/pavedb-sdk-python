stages:
  - mirror
  - test
  - release
  - announce

variables:
  GITHUB_MIRROR_REPO: rodrigopitanga/pavedb-sdk-python

.version-tag: &version-tag
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}\S{0,16}$/'

.stable-tag: &stable-tag
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}$/'

mirror-github:
  image: alpine:3.20
  stage: mirror
  before_script:
    - apk add --no-cache git
  script:
    - |
      test -n "${GITHUB_MIRROR_TOKEN:-}" || {
        echo "GITHUB_MIRROR_TOKEN is missing"
        exit 1
      }
    - git remote remove github-mirror 2>/dev/null || true
    - |
      github_url="https://x-access-token:${GITHUB_MIRROR_TOKEN}"
      github_url="${github_url}@github.com/${GITHUB_MIRROR_REPO}.git"
      git remote add github-mirror "$github_url"
    - |
      main_ref="+refs/heads/${CI_DEFAULT_BRANCH}:"
      main_ref="${main_ref}refs/remotes/origin/${CI_DEFAULT_BRANCH}"
      git fetch origin "$main_ref" "+refs/tags/*:refs/tags/*"
    - |
      main_dst="refs/remotes/origin/${CI_DEFAULT_BRANCH}:"
      main_dst="${main_dst}refs/heads/${CI_DEFAULT_BRANCH}"
      git push github-mirror "$main_dst"
    - git push github-mirror "refs/tags/*:refs/tags/*"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

python:
  image: python:3.12
  stage: test
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -e .[test]
    - python -m compileall -q pavesdk
    - python -m pytest

publish-pypi:
  image: python:3.12
  stage: release
  needs:
    - job: build-package
      artifacts: true
  script:
    - python -m pip install --upgrade twine
    - test -n "${PYPI_TOKEN:-}" || { echo "PYPI_TOKEN is missing"; exit 1; }
    - export TWINE_USERNAME="__token__"
    - export TWINE_PASSWORD="${PYPI_TOKEN}"
    - python -m twine upload dist/*
  <<: *stable-tag

build-package:
  image: python:3.12
  stage: release
  script:
    - python -m pip install --upgrade build twine
    - python -m build --sdist --wheel
    - python -m twine check dist/*
  artifacts:
    paths:
      - dist/
  <<: *version-tag

publish-gitlab-pypi:
  image: python:3.12
  stage: release
  needs:
    - job: build-package
      artifacts: true
  script:
    - python -m pip install --upgrade twine
    - |
      registry_url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi"
      python -m twine upload --skip-existing --repository-url "$registry_url" \
        -u "gitlab-ci-token" -p "$CI_JOB_TOKEN" dist/*
  <<: *version-tag

release-notes:
  image: alpine:3.20
  stage: release
  script:
    - |
      version="${CI_COMMIT_TAG#v}"
      awk -v version="$version" '
        $0 == "## " version { found = 1; next }
        found && /^## / { exit }
        found && !started && NF { started = 1 }
        found && started { print }
        END { if (!found || !started) exit 1 }
      ' CHANGELOG.md > release-notes.md
      test -s release-notes.md
      printf 'PaveDB SDK %s\n' "$version" > release-title.txt
  artifacts:
    paths:
      - release-notes.md
      - release-title.txt
  <<: *stable-tag

announce-gitlab:
  image: registry.gitlab.com/gitlab-org/cli:latest
  stage: announce
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  needs:
    - job: mirror-github
    - job: publish-pypi
    - job: publish-gitlab-pypi
    - job: release-notes
      artifacts: true
  script:
    - |
      glab release create "$CI_COMMIT_TAG" --name "$(cat release-title.txt)" \
        --notes-file release-notes.md --ref "$CI_COMMIT_SHA"
  <<: *stable-tag

announce-github:
  image: alpine:3.20
  stage: announce
  needs:
    - job: mirror-github
    - job: publish-pypi
    - job: publish-gitlab-pypi
    - job: release-notes
      artifacts: true
  before_script:
    - apk add --no-cache git github-cli
  script:
    - |
      test -n "${GITHUB_MIRROR_TOKEN:-}" || {
        echo "GITHUB_MIRROR_TOKEN is missing"
        exit 1
      }
      export GH_TOKEN="$GITHUB_MIRROR_TOKEN"
    - |
      git ls-remote --exit-code \
        "https://github.com/${GITHUB_MIRROR_REPO}.git" \
        "refs/tags/${CI_COMMIT_TAG}"
    - |
      if gh release view "$CI_COMMIT_TAG" --repo "$GITHUB_MIRROR_REPO" \
        >/dev/null 2>&1; then
        gh release edit "$CI_COMMIT_TAG" --repo "$GITHUB_MIRROR_REPO" \
          --title "$(cat release-title.txt)" --notes-file release-notes.md
      else
        gh release create "$CI_COMMIT_TAG" --repo "$GITHUB_MIRROR_REPO" \
          --verify-tag --title "$(cat release-title.txt)" \
          --notes-file release-notes.md
      fi
  <<: *stable-tag
